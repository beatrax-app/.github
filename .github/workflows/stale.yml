# Gentle stale policy: generous grace, easy reopen.
#
# Third-party actions are pinned to a full 40-char commit SHA with the tag
# retained as an inline comment.

name: stale

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "blocked,help wanted,good first issue,security"
          exempt-pr-labels: "blocked,security"
          stale-issue-message: >
            This has been quiet for a while, so it's marked stale. Comment to keep
            it open — it'll close in 14 days otherwise. No hard feelings; reopening
            is one click.
          stale-pr-message: >
            This PR has been quiet for a while, so it's marked stale. A comment or
            push keeps it open.
          close-issue-message: "Closing as stale. Reopen any time — the context is preserved."
